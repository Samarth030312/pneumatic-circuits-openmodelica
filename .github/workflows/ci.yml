name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Library, Python twin, OpenModelica cross-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python packages
        run: pip install numpy==1.26.4 scipy==1.15.3 matplotlib==3.10.8 pytest==8.3.5
      - name: OpenModelica container
        run: docker pull openmodelica/openmodelica:v1.27.1-minimal
      - name: Tests (flow law, closed forms, diagrams, models check in OpenModelica, OpenModelica against the Python twin)
        run: python -m pytest -v tests
